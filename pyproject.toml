[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keysword"
version = "2.0.0"
description = "Deterministic cryptographic key generation from passwords or files"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["cryptography", "key-generation", "deterministic", "password", "bitcoin", "rsa", "ecc"]
authors = [
    {name = "Keysword Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "progressbar2",
    "tqdm",
    "argon2-cffi",
    "pycryptodome",
    "PyNaCl",
    "bitcoin",
    "mnemonic",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
keysword = "keysword.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/keysword"
Repository = "https://github.com/yourusername/keysword"
Issues = "https://github.com/yourusername/keysword/issues"

[tool.setuptools]
packages = ["keysword", "keysword.core", "keysword.io", "keysword.validation", "keysword.ui", "keysword.utils"]

[tool.setuptools.package-data]
keysword = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=keysword",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

